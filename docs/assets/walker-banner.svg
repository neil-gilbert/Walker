    <path d="M300,222 l12,8 l-6,10 l-10,-4 Z M330,250 l10,4 l-4,9 l-9,-3 Z" fill="#7f9a62" stroke="#111" stroke-width="3"/>
    <path d="M286,210 C292,240 290,262 296,280" fill="none" stroke="#4f6580" stroke-width="4"/>
    <circle cx="340" cy="214" r="7" fill="#b3221a"/><circle cx="350" cy="226" r="3.5" fill="#b3221a"/><circle cx="330" cy="206" r="3" fill="#b3221a"/>

    <!-- Neck and head -->
    <path d="M300,176 L298,198 L324,198 L324,178 Z" fill="#7f9a62" stroke="#111" stroke-width="6"/>
    <g transform="rotate(12 310 135)">
      <path d="M270,95 C300,68 346,78 354,110 C362,142 352,172 326,182 C300,192 268,180 260,150 C254,126 258,106 270,95 Z"
            fill="#a9c08a" stroke="#111" stroke-width="7"/>
      <path d="M268,98 l-10,-16 M284,86 l-4,-18 M302,80 l4,-17 M320,82 l12,-12 M336,90 l16,-6" stroke="#111" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="300" cy="124" rx="15" ry="13" fill="#56703f"/>
      <ellipse cx="334" cy="120" rx="13" ry="12" fill="#56703f"/>
      <circle cx="300" cy="125" r="9" fill="#f4f1d8" stroke="#111" stroke-width="3"/><circle cx="303" cy="127" r="3" fill="#111"/>
      <circle cx="334" cy="121" r="8" fill="#f4f1d8" stroke="#111" stroke-width="3"/><circle cx="337" cy="123" r="3" fill="#111"/>
      <path d="M286,106 L312,112 M324,108 L346,104" stroke="#111" stroke-width="5" stroke-linecap="round"/>
      <path d="M318,132 l4,12 l-6,2" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M296,156 L305,150 L312,158 L320,150 L328,157 L337,149 L340,163 C326,173 306,172 296,156 Z" fill="#3a1414" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      <path d="M305,152 l3,6 l3,-6 M320,152 l3,6 l3,-6" fill="#f4f1d8" stroke="none"/>
      <path d="M268,136 L288,150 M272,135 l-4,6 M278,140 l-4,6 M284,145 l-4,6" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <circle cx="346" cy="150" r="4" fill="#b3221a"/>
    </g>

    <!-- Front arm -->
    <polyline points="346,226 402,234" fill="none" stroke="#111" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><polyline points="346,226 402,234" fill="none" stroke="#6f87a3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="402,234 458,226" fill="none" stroke="#111" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/><polyline points="402,234 458,226" fill="none" stroke="#a9c08a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M396,222 l8,6 l-6,6 l8,6" fill="none" stroke="#111" stroke-width="3"/>
    <polyline points="464,222 488,236" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="464,222 488,236" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="463,228 483,245" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="463,228 483,245" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="459,233 474,252" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="459,233 474,252" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="458,219 476,210" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="458,219 476,210" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Speech bubble -->
    <path d="M30,30 L238,30 Q252,30 252,44 L252,104 Q252,118 238,118 L200,118 L262,150 L172,118 L44,118 Q30,118 30,104 L30,44 Q30,30 44,30 Z"
          fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <g font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', cursive" font-weight="700" fill="#111" text-anchor="middle">
      <text x="141" y="60" font-size="22">BRAAAINS...</text>
      <text x="141" y="84" font-size="16">I MEAN... UNTESTED</text>
      <text x="141" y="105" font-size="16">BOUNDARY CONDITIONS</text>
    </g>

    <!-- Title -->
    <g transform="rotate(-4 860 190)" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900">
      <text x="590" y="228" font-size="160" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#111" transform="translate(9 9)">WALKER</text>
      <g fill="#b3221a" stroke="#111" stroke-width="4">
        <path d="M640,224 L640,246 Q640,256 646,256 Q652,256 652,246 L652,224 Z"/>
        <path d="M778,224 L778,262 Q778,272 785,272 Q792,272 792,262 L792,224 Z"/>
        <path d="M948,224 L948,240 Q948,248 953,248 Q958,248 958,240 L958,224 Z"/>
        <path d="M1080,224 L1080,254 Q1080,264 1087,264 Q1094,264 1094,254 L1094,224 Z"/>
      </g>
      <text x="590" y="228" font-size="160" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#b3221a" stroke="#111" stroke-width="7" paint-order="stroke" stroke-linejoin="round">WALKER</text>
    </g>

    <!-- Caption box -->
    <g transform="rotate(-2 860 300)">
      <rect x="604" y="276" width="520" height="52" fill="#111" transform="translate(6 6)"/>
      <rect x="604" y="276" width="520" height="52" fill="#ffd23f" stroke="#111" stroke-width="5"/>
      <text x="864" y="311" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="22" textLength="486" lengthAdjust="spacingAndGlyphs" fill="#111">IF IT STILL WALKS, YOUR TESTS AREN'T DONE.</text>
    </g>
  </g>
  <rect x="8" y="8" width="1184" height="404" rx="6" fill="none" stroke="#111" stroke-width="10"/>
</svg>
