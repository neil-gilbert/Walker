    <text x="162" y="295" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="18" fill="#111">R.I.P.</text>
    <text x="162" y="318" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="11" font-weight="900" fill="#111">100%</text>
    <text x="162" y="332" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="10" font-weight="900" fill="#111">COVERAGE</text>

