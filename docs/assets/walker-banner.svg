    <polyline points="330,282 352,318 346,350" fill="none" stroke="#111" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><polyline points="330,282 352,318 346,350" fill="none" stroke="#4d3d30" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="346,350 374,356" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="346,350 374,356" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M338,322 l10,6 l-4,8" fill="none" stroke="#111" stroke-width="3"/>

    <!-- Torso: torn shirt -->
    <path d="M278,194 C300,186 332,186 352,196 L364,282 L353,276 L345,290 L335,279 L323,294 L312,279 L300,292 L290,278 L278,288 L268,272 Z"
