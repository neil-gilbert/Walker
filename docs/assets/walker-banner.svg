    <polyline points="272,350 248,354" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="272,350 248,354" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="340,206 396,194" fill="none" stroke="#111" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/><polyline points="340,206 396,194" fill="none" stroke="#6f87a3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="396,194 446,188" fill="none" stroke="#111" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/><polyline points="396,194 446,188" fill="none" stroke="#7f9a62" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="448,186 472,197" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="448,186 472,197" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,191 471,206" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,191 471,206" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="447,196 464,213" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="447,196 464,213" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="442,183 456,175" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="442,183 456,175" fill="none" stroke="#a9c08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

