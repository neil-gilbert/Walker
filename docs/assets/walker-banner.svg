<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Walker</title>
  <desc id="desc">Comic-book style banner: a shambling zombie in front of a full moon reaches toward the word WALKER. Caption: If it still walks, your tests aren't done.</desc>
  <defs>
    <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="5.5" cy="5.5" r="2.3" fill="#d9b98a"/>
    </pattern>
    <radialGradient id="fade" cx="0.72" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="halftone"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <clipPath id="panel"><rect x="8" y="8" width="1184" height="404" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="420" fill="#f3e6c8"/>
    <g fill="#f8d98f" opacity="0.55"><polygon points="860,190 1760,190 1757,268"/><polygon points="860,190 1746,346 1729,423"/><polygon points="860,190 1706,498 1676,570"/><polygon points="860,190 1639,640 1597,706"/><polygon points="860,190 1549,769 1496,826"/><polygon points="860,190 1439,879 1376,927"/><polygon points="860,190 1310,969 1240,1006"/><polygon points="860,190 1168,1036 1093,1059"/><polygon points="860,190 1016,1076 938,1087"/><polygon points="860,190 860,1090 782,1087"/><polygon points="860,190 704,1076 627,1059"/><polygon points="860,190 552,1036 480,1006"/><polygon points="860,190 410,969 344,927"/><polygon points="860,190 281,879 224,826"/><polygon points="860,190 171,769 123,706"/><polygon points="860,190 81,640 44,570"/><polygon points="860,190 14,498 -9,423"/><polygon points="860,190 -26,346 -37,268"/><polygon points="860,190 -40,190 -37,112"/><polygon points="860,190 -26,34 -9,-43"/><polygon points="860,190 14,-118 44,-190"/><polygon points="860,190 81,-260 123,-326"/><polygon points="860,190 171,-389 224,-446"/><polygon points="860,190 281,-499 344,-547"/><polygon points="860,190 410,-589 480,-626"/><polygon points="860,190 552,-656 627,-679"/><polygon points="860,190 704,-696 782,-707"/><polygon points="860,190 860,-710 938,-707"/><polygon points="860,190 1016,-696 1093,-679"/><polygon points="860,190 1168,-656 1240,-626"/><polygon points="860,190 1310,-589 1376,-547"/><polygon points="860,190 1439,-499 1496,-446"/><polygon points="860,190 1549,-389 1597,-326"/><polygon points="860,190 1639,-260 1676,-190"/><polygon points="860,190 1706,-118 1729,-43"/><polygon points="860,190 1746,34 1757,112"/></g>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#halftone)"/>

    <!-- Moon -->
    <circle cx="360" cy="175" r="138" fill="#f7d774" stroke="#111" stroke-width="7"/>
    <circle cx="300" cy="120" r="16" fill="#e8c35a"/><circle cx="420" cy="230" r="22" fill="#e8c35a"/><circle cx="405" cy="95" r="10" fill="#e8c35a"/>

    <!-- Ground -->
    <path d="M0,348 C120,332 220,356 360,344 C520,330 640,352 800,342 C960,332 1080,350 1200,340 L1200,420 L0,420 Z" fill="#5d6240" stroke="#111" stroke-width="7"/>
    <path d="M40,375 l30,-6 M180,390 l40,-4 M520,380 l36,-5 M900,372 l44,-6 M1080,392 l30,-4" stroke="#111" stroke-width="4" stroke-linecap="round"/>

