name: Publish project website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p artifacts/site/assets
          cp -R website/. artifacts/site/
          cp docs/assets/* artifacts/site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
